[project]
name = "thetaterm"
version = "0.1.1"
description = "Supercharge your terminal with AI"
readme = "README.md"
authors = [{ name = "ThetaPlex", email = "support@thetaplex.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
keywords = ["shell", "terminal", "cli", "llm", "ollama", "natural-language"]
# no License :: classifier: license (SPDX) replaces it, and PyPI rejects both
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "python-dotenv>=1.2.3",
    "rich>=14.1.0",
    "typer>=0.17.3",
]

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pytest>=8.4.1",
    "ruff>=0.16.9",
]

[project.urls]
Repository = "https://github.com/thetaplex/thetaterm"
Documentation = "https://github.com/thetaplex/thetaterm/tree/main/docs"
Issues = "https://github.com/thetaplex/thetaterm/issues"
Changelog = "https://github.com/thetaplex/thetaterm/blob/main/CHANGELOG.md"

[project.scripts]
tterm = "thetaterm.cli:app"


[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
