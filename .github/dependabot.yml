version: 2

# Weekly, one grouped PR per ecosystem. The cooldown skips releases younger than
# a week, so a hijacked release is usually yanked before we'd pick it up.
# Security updates ignore both and arrive as soon as an advisory is published.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # ruff here and in uv.lock should move together; merge both PRs in the same week
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
