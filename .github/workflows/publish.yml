name: Publish

# Publishing a GitHub Release uploads that tag to PyPI
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    # matches the trusted publisher on pypi.org; add required reviewers here to gate uploads
    environment:
      name: pypi
      url: https://pypi.org/p/thetaterm
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no token stored
    steps:
      # pinned to commits: this job can upload to PyPI, and a tag can be moved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      # a PyPI version can't be re-uploaded, so refuse a tag that disagrees with pyproject.toml
      - run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      # not `uv publish`: this also uploads attestations, so PyPI can show the
      # files were built by this workflow from this repo
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
